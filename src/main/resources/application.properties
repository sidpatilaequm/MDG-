
spring.application.name=file-upload-api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/multimedia_governance?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

attestr.auth.token=${ATTESTR_AUTH_TOKEN}
rapidapi.key=${RAPIDAPI_KEY}
rapidapi.host=gst-insights-api.p.rapidapi.com

business.card.scanner.api.key=${BUSINESS_CARD_SCANNER_API_KEY}
business.card.scanner.api.host=business-card-scanner.p.rapidapi.com
business.card.scanner.api.url=https://business-card-scanner.p.rapidapi.com/processDocument

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.security.user.name=${SPRING_SECURITY_USER:admin}
spring.security.user.password=${SPRING_SECURITY_PASSWORD}
