
spring.application.name=file-upload-api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/multimedia_governance?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway was considered for the new supplier-onboarding/workflow/email tables, but
# spring.jpa.hibernate.ddl-auto is a single, global setting - Hibernate manages DDL for
# every @Entity in this persistence unit, old and new alike, with no way to carve out
# just the new ones for Flyway to own instead. Flyway migrations that CREATE TABLE for an
# entity ddl-auto already manages collide outright; migrations that INSERT seed data hit a
# separate ordering problem (Flyway always runs before Hibernate, so a seed migration for a
# brand-new table fails on the very deploy that introduces it, before ddl-auto has had a
# chance to create that table). Both were confirmed by booting against a throwaway DB.
# New tables are created by ddl-auto like every other MDG- entity; seed data is handled by
# SupplierOnboardingDataSeeder, which runs once the app is fully up and is naturally
# idempotent (checks before inserting), so neither ordering problem applies to it. (No
# flyway dependency is on the classpath, so there is no spring.flyway.* property to set.)

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
# SMTP reachability is not app health - EmailService already logs and swallows send failures
# rather than throwing, so a flaky/misconfigured mail server must never fail the CI deploy's
# health-check gate and trigger an unnecessary rollback.
management.health.mail.enabled=false

server.port=8080
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# OCR tessdata path - server-relative, not invocation-directory-relative, so it
# survives being started by systemd from a different working directory.
ocr.tessdata.path=${OCR_TESSDATA_PATH:${user.dir}/tessdata}

attestr.auth.token=${ATTESTR_AUTH_TOKEN}
rapidapi.key=${RAPIDAPI_KEY}
rapidapi.host=gst-insights-api.p.rapidapi.com

# Microvista KYC (PAN/GSTIN/CIN/Udyam/bank verification for supplier onboarding)
microvista.token.id=${MICROVISTA_TOKEN_ID:}
microvista.token.secret=${MICROVISTA_TOKEN_SECRET:}
microvista.api.version=1

# Signs the one-click approve/reject email-action links - deliberately separate from
# JwtUtil's login-session secret so a leaked action link can never become a login session.
workflow.action-token.secret=${WORKFLOW_ACTION_TOKEN_SECRET}

# Base URL used to build the one-click approve/reject links embedded in approver emails.
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# v1 is single-company/generic: the public "Become a Supplier" flow has no logged-in principal
# to scope a new draft to, so every draft is owned by this one admin account. Falls back to
# whichever super_admin row was created first if left blank.
supplier-onboarding.owning-admin-email=${SUPPLIER_ONBOARDING_OWNING_ADMIN_EMAIL:}

business.card.scanner.api.key=${BUSINESS_CARD_SCANNER_API_KEY}
business.card.scanner.api.host=business-card-scanner.p.rapidapi.com
business.card.scanner.api.url=https://business-card-scanner.p.rapidapi.com/processDocument

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.security.user.name=${SPRING_SECURITY_USER:admin}
spring.security.user.password=${SPRING_SECURITY_PASSWORD}
